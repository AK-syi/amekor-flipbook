<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Amekor Catalog</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #ECEEF5;
    --surface:   #FFFFFF;
    --ink:       #1B1F3B;
    --muted:     #6B7194;
    --accent:    #D4007A;
    --accent-lt: #FCE6F3;
    --border:    #CDD1E3;
    --radius:    4px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: transparent;
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }

  /* ── Stage ── */
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background: transparent;
  }

  /* ── Bottom controls bar ── */
  .bottom-controls {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    z-index: 120;
  }
  .ctrl-btn {
    width: 32px; height: 32px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.9);
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .18s ease;
    backdrop-filter: blur(4px);
    position: relative;
  }
  .ctrl-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-lt);
  }

  /* ── Print dropdown ── */
  .print-menu {
    display: none;
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 4px 16px rgba(27,31,59,.15);
    overflow: hidden;
    white-space: nowrap;
    z-index: 130;
  }
  .print-menu.visible { display: block; }
  .print-option {
    display: block;
    width: 100%;
    padding: 8px 16px;
    border: none;
    background: none;
    color: var(--ink);
    font-family: 'DM Sans', sans-serif;
    font-size: .75rem;
    letter-spacing: .05em;
    cursor: pointer;
    text-align: left;
    transition: background .15s;
  }
  .print-option:hover { background: var(--accent-lt); color: var(--accent); }
  .print-option + .print-option { border-top: 1px solid var(--border); }

  @media (max-width: 700px) {
    .ctrl-btn { width: 28px; height: 28px; font-size: 13px; }
  }

  /* ── Reader layout ── */
  .reader-layout {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .side-nav {
    flex-shrink: 0;
    width: 48px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .side-nav-btn {
    width: 40px; height: 72px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    transition: all .2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .side-nav-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-lt);
  }
  .side-nav-btn:disabled { opacity: 0.25; cursor: default; }

  .book-area {
    flex: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    perspective: 2000px;
    position: relative;
  }
  .book {
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(1deg);
  }
  .display-left, .display-right {
    position: absolute;
    top: 0; width: 50%; height: 100%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .display-left {
    left: 0; border-radius: var(--radius) 0 0 var(--radius);
    box-shadow: inset 4px 0 12px rgba(0,0,0,0.06), -4px 2px 16px rgba(27,31,59,.18);
  }
  .display-right {
    left: 50%; border-radius: 0 var(--radius) var(--radius) 0;
    box-shadow: inset -4px 0 12px rgba(0,0,0,0.06), 4px 2px 16px rgba(27,31,59,.18);
  }
  .display-left canvas, .display-right canvas { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }

  /* ── Spine shadow ── */
  .book::before {
    content: '';
    position: absolute; left: 50%; top: 0;
    width: 6px; height: 100%; transform: translateX(-50%);
    background: linear-gradient(90deg, rgba(0,0,0,0.25) 0%, rgba(255,255,255,0.08) 50%, rgba(0,0,0,0.25) 100%);
    z-index: 100; pointer-events: none;
  }
  .book::after {
    content: '';
    position: absolute; bottom: -14px; left: 8%; width: 84%; height: 14px;
    background: radial-gradient(ellipse, rgba(27,31,59,0.35) 0%, transparent 70%);
    filter: blur(6px); z-index: -1;
  }

  .page-num {
    position: absolute; bottom: 8px;
    font-size: 10px; color: #999;
    font-family: 'DM Sans', sans-serif;
  }
  .display-left .page-num { left: 12px; }
  .display-right .page-num { right: 12px; }

  .page-indicator {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: .72rem;
    color: #fff;
    background: rgba(27,31,59,0.85);
    padding: 5px 18px;
    border-radius: 20px;
    letter-spacing: .1em;
    z-index: 110;
    pointer-events: none;
  }
  .page-indicator strong { color: #FCE6F3; font-weight: 600; }

  /* ── Thumbnail strip ── */
  .thumb-strip {
    position: absolute; bottom: 0; left: 48px; right: 48px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 16px; display: none; gap: 6px;
    overflow-x: auto; z-index: 20;
    box-shadow: 0 -4px 12px rgba(27,31,59,.06);
  }
  .thumb-strip.visible { display: flex; }
  .thumb {
    flex-shrink: 0; width: 44px; height: 58px;
    border: 2px solid transparent; border-radius: 3px;
    overflow: hidden; cursor: pointer; opacity: 0.5;
    transition: all .2s ease; background: #fff;
  }
  .thumb:hover { opacity: 0.85; }
  .thumb.active { border-color: var(--accent); opacity: 1; box-shadow: 0 0 8px rgba(212,0,122,.25); }
  .thumb canvas { width: 100%; height: 100%; object-fit: cover; }

  /* ── Loading ── */
  .loading-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(236,238,245,0.94);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px; z-index: 200;
  }
  .loading-overlay.active { display: flex; }
  .spinner {
    width: 44px; height: 44px;
    border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: .8rem; color: var(--ink); letter-spacing: .12em; text-transform: uppercase; font-weight: 500; }
  .loading-progress { font-size: .72rem; color: var(--muted); }

  .empty-page {
    display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%; color: #ccc; font-size: 13px;
    background: #fafafa;
  }

  /* ── Fullscreen background ── */
  .fullscreen-active { background: var(--bg); }

  /* ── Mobile single-page mode ── */
  .mobile-mode .book { transform: none; }
  .mobile-mode .book::before { display: none; }
  .mobile-mode .display-left {
    width: 100%;
    border-radius: var(--radius);
    box-shadow: 0 4px 20px rgba(27,31,59,.18);
  }
  .mobile-mode .display-right { display: none; }

  @media (max-width: 700px) {
    .side-nav { width: 32px; }
    .side-nav-btn { width: 28px; height: 52px; font-size: 16px; }
    .thumb-strip { left: 32px; right: 32px; }
  }

  /* ── Print support ── */
  #printContainer { display: none; }
  .printing .stage,
  .printing .bottom-controls,
  .printing .thumb-strip,
  .printing .page-indicator { display: none !important; }
  .printing #printContainer { display: block; }

  @media print {
    html, body { width: 100%; height: auto; overflow: visible; background: #fff; }
    body * { visibility: hidden; }
    #printContainer, #printContainer * { visibility: visible; }
    #printContainer {
      display: block !important;
      position: absolute;
      left: 0; top: 0;
      width: 100%;
    }
    .print-page {
      display: block;
      width: 100%;
      height: auto;
      page-break-after: always;
      break-after: page;
    }
    .print-page:last-child { page-break-after: avoid; break-after: avoid; }
    .stage, .bottom-controls, .thumb-strip, .page-indicator,
    .loading-overlay, .side-nav { display: none !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="reader-layout" id="readerLayout">
    <div class="side-nav">
      <button class="side-nav-btn" id="prevBtn" onclick="prevPage()">&#8249;</button>
    </div>
    <div class="book-area">
      <div class="book" id="book">
        <div class="display-left" id="displayLeft"><div class="empty-page"></div></div>
        <div class="display-right" id="displayRight"><div class="empty-page"></div></div>
        <div class="page-indicator" id="pageIndicator"></div>
      </div>
    </div>
    <div class="side-nav">
      <button class="side-nav-btn" id="nextBtn" onclick="nextPage()">&#8250;</button>
    </div>
  </div>

  <div class="bottom-controls">
    <button class="ctrl-btn" id="thumbToggle" onclick="toggleThumbs()" title="Thumbnails">&#9783;</button>
    <button class="ctrl-btn" id="printBtn" onclick="togglePrintMenu()" title="Print">&#128438;</button>
    <div class="print-menu" id="printMenu">
      <button class="print-option" onclick="printPages('current')">Print current spread</button>
      <button class="print-option" onclick="printPages('all')">Print all pages</button>
    </div>
    <button class="ctrl-btn" id="fullscreenBtn" onclick="toggleFullscreen()" title="Fullscreen">&#9974;</button>
  </div>

  <div class="thumb-strip" id="thumbStrip"></div>

  <div class="loading-overlay active" id="loader">
    <div class="spinner"></div>
    <div class="loading-text" id="loadText">Loading catalog&hellip;</div>
    <div class="loading-progress" id="loadProgress"></div>
  </div>
</div>

<script type="module">
  // ── Config from query params ──
  const params = new URLSearchParams(window.location.search);
  const pdfUrl = params.get('pdf');
  const catalogTitle = params.get('title') || 'Catalog';
  const startPage = parseInt(params.get('page') || '1', 10);

  const forceSpread = params.has('spread');
  document.title = 'Amekor ' + catalogTitle;

  if (!pdfUrl) {
    document.getElementById('loadText').textContent = 'No PDF specified';
    document.getElementById('loadProgress').textContent = 'Add ?pdf=URL&title=Name to the embed URL';
    throw new Error('No pdf param');
  }

  // ── PDF.js setup ──
  const pdfjsLib = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

  // ── State ──
  let pdfDoc = null;
  let pageAspect = 1;
  let currentSpread = 0;
  let totalPages = 0;
  let isAnimating = false;
  let isMobileMode = false;

  const thumbCanvases = []; // tiny thumbnails rendered once at load

  const UA = navigator.userAgent;
  const isIPhone = /iPhone/.test(UA);
  const isIPad = /iPad/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
  const isAndroidPhone = /Android/.test(UA) && /Mobile/.test(UA);
  const isMobile = isIPhone || isAndroidPhone || (window.innerWidth < 768 && 'ontouchstart' in window);
  const isTablet = isIPad || (/Android/.test(UA) && !/Mobile/.test(UA));

  const stage = document.getElementById('stage');
  const book = document.getElementById('book');
  const displayLeft = document.getElementById('displayLeft');
  const displayRight = document.getElementById('displayRight');
  const pageIndicator = document.getElementById('pageIndicator');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const loader = document.getElementById('loader');
  const loadText = document.getElementById('loadText');
  const loadProgress = document.getElementById('loadProgress');
  const thumbStrip = document.getElementById('thumbStrip');

  let pdfBaseWidth = 612, pdfBaseHeight = 792; // defaults, updated on load

  // ── Detect mobile → single page mode ──
  function checkMobileMode() {
    const wasMobile = isMobileMode;
    isMobileMode = forceSpread ? false : window.innerWidth < 700;
    if (isMobileMode) {
      stage.classList.add('mobile-mode');
    } else {
      stage.classList.remove('mobile-mode');
    }
    return wasMobile !== isMobileMode;
  }
  checkMobileMode();

  // ── Load PDF ──
  try {
    loadText.textContent = 'Fetching PDF…';
    pdfDoc = await pdfjsLib.getDocument({ url: pdfUrl }).promise;
    totalPages = pdfDoc.numPages;

    // Get base dimensions from first page
    const firstPage = await pdfDoc.getPage(1);
    const baseVp = firstPage.getViewport({ scale: 1 });
    pdfBaseWidth = baseVp.width;
    pdfBaseHeight = baseVp.height;
    pageAspect = pdfBaseWidth / pdfBaseHeight;

    // Build thumbnails at low res (fast, low memory)
    loadText.textContent = 'Building thumbnails…';
    const THUMB_SCALE = 0.5;
    for (let p = 1; p <= totalPages; p++) {
      loadProgress.textContent = `${p} / ${totalPages}`;
      const page = await pdfDoc.getPage(p);
      const vp = page.getViewport({ scale: THUMB_SCALE });
      const c = document.createElement('canvas');
      c.width = vp.width;
      c.height = vp.height;
      const ctx = c.getContext('2d');
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      thumbCanvases.push(c);
    }

    buildThumbnails();
    sizeBook();

    if (isMobileMode) {
      currentSpread = Math.max(0, Math.min(startPage - 1, totalPages - 1));
    } else {
      currentSpread = Math.max(0, Math.floor((startPage - 1) / 2));
    }
    await showSpread(currentSpread);
    loader.classList.remove('active');

  } catch (e) {
    loadText.textContent = 'Failed to load PDF';
    loadProgress.textContent = e.message || String(e);
  }

  // ── Sizing ──
  function sizeBook() {
    if (totalPages === 0) return;
    const sideNavW = window.innerWidth <= 700 ? 32 : 48;
    const availW = window.innerWidth - sideNavW * 2 - 8;
    const availH = window.innerHeight - 4;

    let bookW, bookH;
    if (isMobileMode) {
      const singleAspect = pageAspect;
      if (availW / availH > singleAspect) {
        bookH = availH;
        bookW = bookH * singleAspect;
      } else {
        bookW = availW;
        bookH = bookW / singleAspect;
      }
    } else {
      const spreadAspect = 2 * pageAspect;
      if (availW / availH > spreadAspect) {
        bookH = availH;
        bookW = bookH * spreadAspect;
      } else {
        bookW = availW;
        bookH = bookW / spreadAspect;
      }
    }
    book.style.width = bookW + 'px';
    book.style.height = bookH + 'px';
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    const modeChanged = checkMobileMode();
    sizeBook();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (totalPages > 0) {
        if (modeChanged) {
          if (isMobileMode) {
            currentSpread = currentSpread * 2;
          } else {
            currentSpread = Math.floor(currentSpread / 2);
          }
        }
        showSpread(currentSpread);
      }
    }, 150);
  });

  // ── Display helpers ──

  /**
   * Calculate PDF.js scale to fill container at device pixel ratio.
   * Uses a high minimum so text/details stay crisp.
   */
  function scaleForContainer(cw, ch) {
    const dpr = window.devicePixelRatio || 1;
    const contAspect = cw / ch;
    let targetW;
    if (contAspect > pageAspect) {
      // container wider than page — height-limited
      targetW = ch * pageAspect * dpr;
    } else {
      targetW = cw * dpr;
    }
    const scale = targetW / pdfBaseWidth;
    // Minimum scale 3 ensures crisp rendering even on small displays
    return Math.max(isMobile ? 2.5 : 3, scale);
  }

  /**
   * Render PDF page directly into container — single render, no copies.
   */
  async function renderPageToContainer(container, idx) {
    container.innerHTML = '';
    if (idx < totalPages) {
      container.style.background = 'none';
      const cw = container.clientWidth || 1;
      const ch = container.clientHeight || 1;
      const scale = scaleForContainer(cw, ch);

      // Render PDF directly to canvas
      const page = await pdfDoc.getPage(idx + 1);
      const vp = page.getViewport({ scale });
      const c = document.createElement('canvas');
      c.width = vp.width;
      c.height = vp.height;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      await page.render({ canvasContext: ctx, viewport: vp }).promise;

      // CSS sizing to fit container (browser downscales crispy)
      const contAspect = cw / ch;
      let dw, dh;
      if (contAspect > pageAspect) {
        dh = ch; dw = dh * pageAspect;
      } else {
        dw = cw; dh = dw / pageAspect;
      }
      c.style.width = dw + 'px';
      c.style.height = dh + 'px';
      c.style.display = 'block';
      container.appendChild(c);

      const pn = document.createElement('div');
      pn.className = 'page-num';
      pn.textContent = idx + 1;
      container.appendChild(pn);
    } else {
      container.style.background = '#fafafa';
      container.innerHTML = '<div class="empty-page"></div>';
    }
  }

  /**
   * Sync version for flip animation faces — uses thumbnail as instant placeholder.
   * After flip lands, showSpread re-renders at full quality.
   */
  function renderPageToContainerSync(container, idx) {
    container.innerHTML = '';
    if (idx < totalPages) {
      container.style.background = 'none';
      const src = thumbCanvases[idx];
      const cw = container.clientWidth || 1;
      const ch = container.clientHeight || 1;
      const contAspect = cw / ch;
      let dw, dh;
      if (contAspect > pageAspect) {
        dh = ch; dw = dh * pageAspect;
      } else {
        dw = cw; dh = dw / pageAspect;
      }
      const c = document.createElement('canvas');
      const dpr = window.devicePixelRatio || 1;
      c.width = Math.max(1, Math.round(dw * dpr));
      c.height = Math.max(1, Math.round(dh * dpr));
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(src, 0, 0, c.width, c.height);
      c.style.width = dw + 'px';
      c.style.height = dh + 'px';
      c.style.display = 'block';
      container.appendChild(c);
      const pn = document.createElement('div');
      pn.className = 'page-num';
      pn.textContent = idx + 1;
      container.appendChild(pn);
    } else {
      container.style.background = '#fafafa';
      container.innerHTML = '<div class="empty-page"></div>';
    }
  }

  async function showSpread(spreadIdx) {
    if (isMobileMode) {
      await renderPageToContainer(displayLeft, spreadIdx);
      updateIndicators(spreadIdx);
    } else {
      const leftIdx = spreadIdx * 2;
      const rightIdx = spreadIdx * 2 + 1;
      await Promise.all([
        renderPageToContainer(displayLeft, leftIdx),
        renderPageToContainer(displayRight, rightIdx),
      ]);
      updateIndicators(spreadIdx);
    }
  }

  function maxSpread() {
    if (isMobileMode) return totalPages - 1;
    return Math.ceil(totalPages / 2) - 1;
  }

  function updateIndicators(spreadIdx) {
    if (isMobileMode) {
      pageIndicator.innerHTML = `<strong>${spreadIdx + 1}</strong> of ${totalPages}`;
    } else {
      const leftIdx = spreadIdx * 2;
      const rightIdx = spreadIdx * 2 + 1;
      const l = leftIdx + 1;
      const r = Math.min(rightIdx + 1, totalPages);
      pageIndicator.innerHTML = l === r || rightIdx >= totalPages
        ? `<strong>${l}</strong> of ${totalPages}`
        : `<strong>${l}</strong> &ndash; <strong>${r}</strong> of ${totalPages}`;
    }
    prevBtn.disabled = spreadIdx <= 0;
    nextBtn.disabled = spreadIdx >= maxSpread();

    document.querySelectorAll('.thumb').forEach((t, i) => {
      if (isMobileMode) {
        t.classList.toggle('active', i === spreadIdx);
      } else {
        t.classList.toggle('active', i === spreadIdx * 2 || i === spreadIdx * 2 + 1);
      }
    });
    const at = thumbStrip.querySelector('.thumb.active');
    if (at) at.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  }

  // ── Page flip animation (desktop spread mode) ──
  function flipTo(newSpread, direction) {
    if (isAnimating) return;
    if (newSpread < 0 || newSpread > maxSpread()) return;

    if (isMobileMode) {
      isAnimating = true;
      const slideDir = direction === 'next' ? -1 : 1;
      const oldCanvas = displayLeft.querySelector('canvas');
      if (oldCanvas) {
        oldCanvas.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
        oldCanvas.style.transform = `translateX(${slideDir * 40}px)`;
        oldCanvas.style.opacity = '0';
      }
      setTimeout(async () => {
        currentSpread = newSpread;
        await showSpread(currentSpread);
        const newCanvas = displayLeft.querySelector('canvas');
        if (newCanvas) {
          newCanvas.style.transform = `translateX(${-slideDir * 40}px)`;
          newCanvas.style.opacity = '0';
          requestAnimationFrame(() => {
            newCanvas.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
            newCanvas.style.transform = 'translateX(0)';
            newCanvas.style.opacity = '1';
          });
        }
        setTimeout(() => { isAnimating = false; }, 320);
      }, 200);
      return;
    }

    isAnimating = true;
    const flipEl = document.createElement('div');
    Object.assign(flipEl.style, {
      position: 'absolute', top: '0', width: '50%', height: '100%',
      zIndex: '100', transformStyle: 'preserve-3d',
      transition: 'transform 0.65s cubic-bezier(0.645, 0.045, 0.355, 1.000)',
    });

    const makeFace = (isBack) => {
      const face = document.createElement('div');
      Object.assign(face.style, {
        position: 'absolute', top: '0', left: '0', width: '100%', height: '100%',
        backfaceVisibility: 'hidden', background: '#fff',
        display: 'flex', alignItems: 'center', justifyContent: 'center', overflow: 'hidden',
      });
      if (isBack) face.style.transform = 'rotateY(180deg)';
      return face;
    };

    const halfW = displayLeft.clientWidth || 1;
    const halfH = displayLeft.clientHeight || 1;
    const clonePage = (idx) => {
      if (idx >= totalPages) return null;
      const src = thumbCanvases[idx];
      const dpr = window.devicePixelRatio || 1;
      const contAspect = halfW / halfH;
      let dw, dh;
      if (contAspect > pageAspect) { dh = halfH; dw = dh * pageAspect; }
      else { dw = halfW; dh = dw / pageAspect; }
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(dw * dpr));
      c.height = Math.max(1, Math.round(dh * dpr));
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(src, 0, 0, c.width, c.height);
      c.style.width = dw + 'px';
      c.style.height = dh + 'px';
      c.style.display = 'block';
      return c;
    };

    const newLeftIdx = newSpread * 2;
    const newRightIdx = newSpread * 2 + 1;

    if (direction === 'next') {
      flipEl.style.left = '50%';
      flipEl.style.transformOrigin = 'left center';
      const front = makeFace(false), back = makeFace(true);
      const fc = clonePage(currentSpread * 2 + 1); if (fc) front.appendChild(fc);
      const bc = clonePage(newLeftIdx); if (bc) back.appendChild(bc);
      flipEl.appendChild(front); flipEl.appendChild(back);
      book.appendChild(flipEl);
      renderPageToContainerSync(displayRight, newRightIdx);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        flipEl.style.transform = 'rotateY(-180deg)';
      }));
      flipEl.addEventListener('transitionend', async () => {
        await renderPageToContainer(displayLeft, newLeftIdx);
        // Also upgrade right side to high-res if it was from cache
        await renderPageToContainer(displayRight, newRightIdx);
        book.removeChild(flipEl);
        currentSpread = newSpread;
        updateIndicators(currentSpread);
        isAnimating = false;
      }, { once: true });
    } else {
      flipEl.style.left = '0';
      flipEl.style.transformOrigin = 'right center';
      const front = makeFace(false), back = makeFace(true);
      const fc = clonePage(currentSpread * 2); if (fc) front.appendChild(fc);
      const bc = clonePage(newRightIdx); if (bc) back.appendChild(bc);
      flipEl.appendChild(front); flipEl.appendChild(back);
      book.appendChild(flipEl);
      renderPageToContainerSync(displayLeft, newLeftIdx);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        flipEl.style.transform = 'rotateY(180deg)';
      }));
      flipEl.addEventListener('transitionend', async () => {
        await renderPageToContainer(displayRight, newRightIdx);
        await renderPageToContainer(displayLeft, newLeftIdx);
        book.removeChild(flipEl);
        currentSpread = newSpread;
        updateIndicators(currentSpread);
        isAnimating = false;
      }, { once: true });
    }
  }

  window.nextPage = () => flipTo(currentSpread + 1, 'next');
  window.prevPage = () => flipTo(currentSpread - 1, 'prev');

  // ── Keyboard ──
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); window.nextPage(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); window.prevPage(); }
  });

  // ── Thumbnails ──
  function buildThumbnails() {
    thumbStrip.innerHTML = '';
    thumbCanvases.forEach((tc, i) => {
      const div = document.createElement('div');
      div.className = 'thumb';
      const c = document.createElement('canvas');
      const scale = 44 / tc.width;
      c.width = 44;
      c.height = tc.height * scale;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(tc, 0, 0, c.width, c.height);
      div.appendChild(c);
      div.addEventListener('click', () => {
        let target;
        if (isMobileMode) {
          target = i;
        } else {
          target = Math.floor(i / 2);
        }
        if (target !== currentSpread) flipTo(target, target > currentSpread ? 'next' : 'prev');
      });
      thumbStrip.appendChild(div);
    });
  }

  window.toggleThumbs = () => thumbStrip.classList.toggle('visible');

  // ── Fullscreen (desktop only — hidden on mobile) ──
  const canFullscreen = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  if (!canFullscreen || isMobile || isTablet) {
    document.getElementById('fullscreenBtn').style.display = 'none';
  }

  window.toggleFullscreen = () => {
    const el = document.documentElement;
    const isFS = document.fullscreenElement || document.webkitFullscreenElement;
    if (!isFS) {
      const rfs = el.requestFullscreen || el.webkitRequestFullscreen;
      if (rfs) {
        rfs.call(el).catch(() => {});
        document.body.classList.add('fullscreen-active');
      }
    } else {
      const efs = document.exitFullscreen || document.webkitExitFullscreen;
      if (efs) efs.call(document);
      document.body.classList.remove('fullscreen-active');
    }
  };
  const fsChange = () => {
    const isFS = document.fullscreenElement || document.webkitFullscreenElement;
    if (!isFS) document.body.classList.remove('fullscreen-active');
    requestAnimationFrame(() => { sizeBook(); showSpread(currentSpread); });
  };
  document.addEventListener('fullscreenchange', fsChange);
  document.addEventListener('webkitfullscreenchange', fsChange);

  // ── Print ──
  const printMenu = document.getElementById('printMenu');
  window.togglePrintMenu = () => {
    printMenu.classList.toggle('visible');
  };
  // Close menu on outside click
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#printBtn') && !e.target.closest('#printMenu')) {
      printMenu.classList.remove('visible');
    }
  });

  window.printPages = async (mode) => {
    printMenu.classList.remove('visible');

    let pageIndices = [];
    if (mode === 'current') {
      if (isMobileMode) {
        pageIndices = [currentSpread];
      } else {
        pageIndices.push(currentSpread * 2);
        if (currentSpread * 2 + 1 < totalPages) pageIndices.push(currentSpread * 2 + 1);
      }
    } else {
      for (let i = 0; i < totalPages; i++) pageIndices.push(i);
    }

    // Render into hidden print container in same document (avoids cross-origin block)
    let printContainer = document.getElementById('printContainer');
    if (!printContainer) {
      printContainer = document.createElement('div');
      printContainer.id = 'printContainer';
      document.body.appendChild(printContainer);
    }
    printContainer.innerHTML = '';
    document.body.classList.add('printing');

    const PRINT_SCALE = 4;
    for (const idx of pageIndices) {
      const page = await pdfDoc.getPage(idx + 1);
      const vp = page.getViewport({ scale: PRINT_SCALE });
      const c = document.createElement('canvas');
      c.width = vp.width;
      c.height = vp.height;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      const img = new Image();
      img.src = c.toDataURL('image/png');
      img.className = 'print-page';
      printContainer.appendChild(img);
    }

    // Brief delay for images to decode, then print
    await new Promise(r => setTimeout(r, 200));
    window.print();

    // Cleanup after print dialog closes
    setTimeout(() => {
      document.body.classList.remove('printing');
      printContainer.innerHTML = '';
    }, 500);
  };

  // ── Touch: swipe on book ──
  (function setupSwipe() {
    let sx = 0, sy = 0, st = 0, tracking = false;
    const SWIPE_MIN_X = 50;
    const SWIPE_MAX_Y = 80;
    const SWIPE_MAX_T = 600;
    const SWIPE_TAP_MAX = 10;

    book.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) { tracking = false; return; }
      const t = e.touches[0];
      sx = t.clientX; sy = t.clientY; st = Date.now();
      tracking = true;
    }, { passive: true });

    book.addEventListener('touchend', (e) => {
      if (!tracking) return;
      tracking = false;
      const t = e.changedTouches[0];
      const dx = t.clientX - sx;
      const dy = t.clientY - sy;
      const dt = Date.now() - st;
      const absX = Math.abs(dx), absY = Math.abs(dy);
      if (absX < SWIPE_TAP_MAX && absY < SWIPE_TAP_MAX) return;
      if (dt < SWIPE_MAX_T && absX > SWIPE_MIN_X && absY < SWIPE_MAX_Y) {
        e.preventDefault();
        if (dx < 0) window.nextPage(); else window.prevPage();
      }
    }, { passive: false });
  })();
</script>

</body>
</html>
